<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 54" width="180" height="42">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fae1ea"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#subtleGlow)">
    <!-- Crown & Comb Crest Icon -->
    <g transform="translate(4, 4)">
      <!-- Crown Diadem Peak -->
      <path d="M5 25 L8 12 L15 19 L21 7 L27 19 L34 12 L37 25 Z" fill="url(#goldGrad)"/>
      <path d="M4 27 L38 27 L37 31 L5 31 Z" fill="url(#goldGrad)"/>
      <!-- Comb teeth extending downward from diadem -->
      <rect x="6" y="32" width="2" height="7" rx="0.8" fill="url(#goldGrad)"/>
      <rect x="10" y="32" width="2" height="7" rx="0.8" fill="url(#goldGrad)"/>
      <rect x="14" y="32" width="2" height="7" rx="0.8" fill="url(#goldGrad)"/>
      <rect x="18" y="32" width="2" height="7" rx="0.8" fill="url(#goldGrad)"/>
      <rect x="22" y="32" width="2" height="7" rx="0.8" fill="url(#goldGrad)"/>
      <rect x="26" y="32" width="2" height="7" rx="0.8" fill="url(#goldGrad)"/>
      <rect x="30" y="32" width="2" height="7" rx="0.8" fill="url(#goldGrad)"/>
      <rect x="34" y="32" width="2" height="7" rx="0.8" fill="url(#goldGrad)"/>
      <!-- Crown Jewels -->
      <circle cx="8" cy="10" r="1.8" fill="#ffffff"/>
      <circle cx="21" cy="5.5" r="2.2" fill="#ffffff"/>
      <circle cx="34" cy="10" r="1.8" fill="#ffffff"/>
      <circle cx="15" cy="17" r="1.2" fill="#ffffff" opacity="0.9"/>
      <circle cx="27" cy="17" r="1.2" fill="#ffffff" opacity="0.9"/>
    </g>
    <!-- Brand Typography -->
    <text x="48" y="27" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="20" font-weight="700" letter-spacing="1.5" fill="url(#goldGrad)">CROWN &amp; COMB</text>
    <text x="49" y="41" font-family="'Lato', 'Montserrat', -apple-system, sans-serif" font-size="7.5" font-weight="500" letter-spacing="3.2" fill="#ffffff" opacity="0.95">LUXURY SALON &amp; SPA</text>
  </g>
</svg>
